<!doctype html>
<html><head><meta charset="utf-8">
<title>Red Carpet Tours: Visa Ad</title>
<style>
@font-face{font-family:DMS;src:url(fonts/DMSerif.ttf)}
@font-face{font-family:DMS;font-style:italic;src:url(fonts/DMSerif-Italic.ttf)}
@font-face{font-family:Pop;font-weight:400;src:url(fonts/Poppins-Regular.ttf)}
@font-face{font-family:Pop;font-weight:500;src:url(fonts/Poppins-Medium.ttf)}
@font-face{font-family:Pop;font-weight:600;src:url(fonts/Poppins-SemiBold.ttf)}
@font-face{font-family:Cav;src:url(fonts/Caveat.ttf)}
:root{--red:#A6192E;--red2:#c8243c;--deep:#6e0e1c;--paper:#F2EFEA;--ink:#151515;--navy:#1c2a4d;--gold:#cfa75a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
.layer{position:absolute;inset:0;display:none;overflow:hidden}
.paper{background-color:var(--paper)}
canvas.full{position:absolute;inset:0;width:1080px;height:1920px}
.abs{position:absolute}
.ser{font-family:DMS;font-weight:400}
.pop{font-family:Pop}
#grain{position:absolute;inset:-20px;pointer-events:none;opacity:.10;mix-blend-mode:overlay;z-index:50}
#vig{position:absolute;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.18) 100%)}
.badge{display:inline-block;width:1em;height:1em;vertical-align:-.12em;margin-left:.25em}
/* typing bar */
.tbar{position:absolute;left:0;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.tbar .txt{position:absolute;left:70px;top:50%;transform:translateY(-52%);font-family:Pop;font-weight:400;color:var(--ink);white-space:nowrap}
.tbar .under{position:absolute;left:0;bottom:-26px;height:16px;background:var(--ink)}
.ibeam{display:inline-block;width:.04em;height:.82em;background:var(--ink);position:relative;vertical-align:-.06em;margin-left:.04em}
.ibeam:before,.ibeam:after{content:"";position:absolute;left:-.09em;width:.22em;height:.04em;background:var(--ink)}
.ibeam:before{top:0}.ibeam:after{bottom:0}
/* echo */
.echo{position:absolute;left:0;right:0;text-align:center;color:#fff}
.echo .big{font-family:DMS;font-size:300px;line-height:.9;display:block}
.echo .sub{font-family:Pop;font-weight:400;font-size:84px;display:block;line-height:1.1}
.ghost{position:absolute;left:0;right:0;text-align:center;font-family:DMS;font-size:300px;line-height:.9;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.9)}
/* grid */
.row{position:absolute;left:0;right:0;text-align:center;font-family:DMS;white-space:nowrap;line-height:1}
.flagbox{position:absolute;left:50%;top:50%;width:440px;height:330px;margin:-165px 0 0 -220px;box-shadow:0 30px 60px rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.2);overflow:hidden}
.flagbox img{width:100%;height:100%;display:block}
.flagbox .wave{position:absolute;inset:0;mix-blend-mode:soft-light}
/* collage */
.shadow{filter:drop-shadow(0 18px 22px rgba(0,0,0,.35)) drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.vstamp{position:absolute;width:560px;height:170px;border:7px solid #fff;border-radius:10px;color:#fff;font-family:Pop}
.vstamp .k{position:absolute;left:34px;top:18px;font-weight:600;font-size:64px;letter-spacing:3px}
.vstamp .s{position:absolute;left:36px;bottom:18px;font-size:22px;letter-spacing:4px;opacity:.85}
.vstamp .arr{position:absolute;right:26px;top:24px;width:70px;height:56px;border:5px solid #fff;border-radius:6px}
.rc{position:absolute;width:96px;height:96px;background:linear-gradient(160deg,#c42a3e,#9a1628);border-radius:4px;z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.rc span{position:absolute;left:4px;top:-14px;font-family:Cav;font-weight:700;font-size:92px;color:#fff;text-shadow:0 0 6px rgba(255,255,255,.7);letter-spacing:-4px}
.logo{position:absolute;width:400px;height:400px;background:var(--red);box-shadow:0 30px 60px rgba(110,14,28,.35)}
.logo .r{position:absolute;left:0;right:0;top:84px;text-align:center;font-family:Inter;font-weight:300;font-size:150px;color:#fff;letter-spacing:6px;line-height:1}
.logo .c{position:absolute;left:0;right:0;top:248px;text-align:center;font-family:Inter;font-weight:300;font-size:46px;color:#fff;letter-spacing:22px;padding-left:22px}
.logo .b{position:absolute;left:0;right:0;bottom:0;height:62px;background:#fff;text-align:center;font-family:Inter;font-weight:400;font-size:36px;letter-spacing:8px;line-height:62px;color:#111}
.btn{position:absolute;left:50%;width:660px;height:150px;margin-left:-330px;border-radius:80px;background:var(--red);color:#fff;font-family:Pop;font-weight:600;font-size:60px;text-align:center;line-height:150px;box-shadow:0 20px 40px rgba(166,25,46,.35)}
.fl{position:absolute;width:96px;height:96px;border-radius:50%;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.25);border:4px solid #fff}
.fl img{width:100%;height:100%;object-fit:cover}
</style>
<script src="node_modules/d3-array/dist/d3-array.min.js"></script>

</head><body>

    <svg class="abs" id="plane1" width="300" height="140" viewBox="0 0 300 140" style="left:0;top:0">

      <g transform="translate(110,10) rotate(90 60 60) scale(5)" fill="#fff"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></g>
    </svg>
    <div class="abs pop" id="g_txt" style="left:0;right:0;top:1180px;text-align:center;color:#fff;font-size:70px;font-weight:500;text-shadow:0 4px 20px rgba(0,0,0,.5)">passport ready<svg class="badge" viewBox="0 0 24 24"><path d="M12 1.5l9 5.2v10.6l-9 5.2-9-5.2V6.7z" fill="none" stroke="#fff" stroke-width="2"/><path d="M7.5 12.2l3 3 6-6.2" fill="none" stroke="#fff" stroke-width="2.4"/></svg></div>
  </div>
  <!-- 1b typing -->

    <div class="tbar" id="ty_bar" style="top:820px;height:200px;width:900px"><div class="txt" id="ty_txt" style="font-size:150px"></div><div class="under" id="ty_under"></div></div>
    <svg class="abs" id="ty_badge" width="190" height="190" viewBox="0 0 24 24" style="left:820px;top:1080px"><path d="M12 1.5l9 5.2v10.6l-9 5.2-9-5.2V6.7z" fill="var(--red)"/><text x="12" y="16.6" text-anchor="middle" font-family="DMS" font-size="13" fill="#fff">?</text></svg>
  </div>
  <!-- 2 sky -->

    <svg class="abs" id="plane2" width="760" height="760" viewBox="0 0 24 24" style="left:160px;top:1300px"><path fill="#1d4757" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
    <div id="echoes"></div>

    <div class="flagbox" id="flagbox"><img id="flagimg"><div class="wave" id="wave"></div></div>
    <div class="tbar" id="sch_bar" style="top:1500px;height:150px;width:960px;display:none"><div class="txt" id="sch_txt" style="font-size:78px"></div><div class="under" id="sch_under"></div></div>
  </div>
  <!-- 4 blueprint + collage -->
  <div class="layer" id="L_blue">
    <div class="abs" id="bp" style="inset:-60px"></div>
    <div class="abs" id="collage" style="left:0;top:0;width:1080px;height:640px"></div>
    <div class="abs ser" id="tp1" style="left:70px;top:700px;font-size:120px;color:#fff;line-height:1">whatever</div>
    <div class="abs ser" id="tp2" style="left:70px;top:820px;font-size:120px;color:#fff;line-height:1">the trip,</div>
    <div id="vst"></div>
  </div>
  <!-- 5 torn paper process -->
  <div class="layer" id="L_proc">
    <div class="abs" id="bp2" style="inset:-60px"></div>
    <svg class="abs" id="tear" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))"></svg>
    <div id="plines"></div>
    <svg class="abs" id="pen" width="520" height="140" viewBox="0 0 520 140" style="left:0;top:0;transform-origin:0 70px">
      <defs><linearGradient id="pb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3473a"/><stop offset=".45" stop-color="#7a1e18"/><stop offset="1" stop-color="#3e0c09"/></linearGradient>
      <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2a4"/><stop offset=".5" stop-color="#c79a3c"/><stop offset="1" stop-color="#7d5a17"/></linearGradient></defs>
      <path d="M0 70 L60 58 L60 82 Z" fill="#222"/><path d="M0 70 L60 66 L60 74Z" fill="#888"/>
      <rect x="58" y="52" width="70" height="36" rx="6" fill="url(#pg)"/>
      <rect x="126" y="48" width="360" height="44" rx="20" fill="url(#pb)"/>
      <rect x="300" y="46" width="22" height="48" fill="url(#pg)"/>
      <rect x="330" y="38" width="150" height="10" rx="5" fill="url(#pg)"/>
    </svg>
  </div>
  <!-- 6 end card -->
  <div class="layer paper" id="L_end">
    <div class="logo" id="logo" style="left:340px;top:200px"><div class="r">RED</div><div class="c">CARPET</div><div class="b">TOURS PVT LTD</div></div>
    <div class="abs ser" id="e1" style="left:0;right:0;top:700px;text-align:center;font-size:130px;color:var(--ink);line-height:1">Your visa,</div>
    <div class="abs ser" id="e2" style="left:0;right:0;top:840px;text-align:center;font-size:150px;font-style:italic;color:var(--red);line-height:1">sorted.</div>
    <svg class="abs" id="e2u" width="520" height="40" viewBox="0 0 520 40" style="left:280px;top:1000px"><path id="e2p" d="M8 26 C120 10 300 8 512 18" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round"/></svg>
    <div class="abs pop" id="e3" style="left:0;right:0;top:1100px;text-align:center;font-size:36px;color:#555;letter-spacing:1px">Tourist · Business · Family · e-Visa · m-Visa</div>

  <!-- red carpet roll transition -->

    <div class="abs" style="left:0;right:0;top:-70px;height:140px;border-radius:70px;background:linear-gradient(180deg,#5c0b17,#c8334a 40%,#e46a7c 52%,#8e1424 80%,#4a0811);box-shadow:0 -10px 30px rgba(0,0,0,.4)"></div>
    <div class="abs" style="left:40px;right:40px;top:0;bottom:0;border-left:6px solid #d9b45a;border-right:6px solid #d9b45a;opacity:.8"></div>
  </div>
  <div class="rc" id="rcb" style="left:56px;top:70px;display:none"><span>RC</span></div>
  <div id="vig"></div>
  <canvas id="grain" width="560" height="1000" style="width:1120px;height:2000px"></canvas>
</div>
<script>
const W = 1080, H = 1920, FPS = 30;
const C = TL.cues, S = TL.scenes;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eb = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const tw = (t, t0, d, e = eo) => e(clamp((t - t0) / d));
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const cs = k => C[k][0], ce = k => C[k][0] + C[k][1];

/* ---------- textures ---------- */
function noiseCanvas(w, h, seed, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); const d = x.createImageData(w, h); const r = rng(seed);
  for (let i = 0; i < w * h; i++) { const v = fn(r, i % w, (i / w) | 0); d.data.set(v, i * 4); } x.putImageData(d, 0, 0); return c; }
const grains = [...Array(6)].map((_, k) => noiseCanvas(560, 1000, 11 + k, r => { const v = 128 + (r() - .5) * 255; return [v, v, v, 255]; }));
const paperTex = noiseCanvas(540, 960, 3, (r) => { const v = r() < .004 ? 150 + r() * 40 : 238 + r() * 10; return [v, v - 2, v - 6, 255]; });
const paperURL = paperTex.toDataURL();
document.querySelectorAll('.paper').forEach(e => { e.style.backgroundImage = `url(${paperURL})`; e.style.backgroundSize = '1080px 1920px'; });

// value-noise fbm
function fbmField(w, h, seed, oct = 5, base = 24) { const r = rng(seed); const f = new Float32Array(w * h);
  for (let o = 0; o < oct; o++) { const g = base * 2 ** o, cell = W / g * (w / W), gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2; const grid = Float32Array.from({ length: gw * gh }, r); const amp = .5 ** o;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const gx = x / cell, gy = y / cell, x0 = gx | 0, y0 = gy | 0, fx = gx - x0, fy = gy - y0, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const a = grid[y0 * gw + x0], b = grid[y0 * gw + x0 + 1], c = grid[(y0 + 1) * gw + x0], d = grid[(y0 + 1) * gw + x0 + 1];
      f[y * w + x] += amp * lerp(lerp(a, b, sx), lerp(c, d, sx), sy); } }
  return f; }
// clouds texture (tall, for scrolling)
const CW = 270, CH = 960; const cf = fbmField(CW, CH, 5, 5, 3);
const clouds = noiseCanvas(CW, CH, 1, (r, x, y) => { const v = cf[y * CW + x] / 1.94; const k = clamp((v - .42) / .3); const kk = k * k * (3 - 2 * k);
  const sky = [lerp(46, 120, y / CH), lerp(110, 170, y / CH), lerp(196, 230, y / CH)]; const shade = lerp(.78, 1, clamp((v - .5) / .3));
  return [lerp(sky[0], 255 * shade, kk), lerp(sky[1], 255 * shade, kk), lerp(sky[2], 255 * shade * 1.02, kk), 255]; });
// land texture
const lf = fbmField(540, 960, 9, 5, 6);
const landTex = noiseCanvas(540, 960, 2, (r, x, y) => { const v = lf[y * 540 + x] / 1.94 + (r() - .5) * .08; const g = [lerp(70, 168, v), lerp(110, 150, v), lerp(40, 80, v)]; return [g[0], g[1], g[2], 255]; });
const oceanTex = noiseCanvas(540, 960, 4, (r, x, y) => { const v = lf[(959 - y) * 540 + (539 - x)] / 1.94; return [lerp(18, 40, v), lerp(60, 98, v), lerp(110, 150, v), 255]; });

/* ---------- globe ---------- */
const land = topojson.feature(WORLD, WORLD.objects.countries);
const borders = topojson.mesh(WORLD, WORLD.objects.countries, (a, b) => a !== b);
const gctx = $('globe').getContext('2d');
const landPat = gctx.createPattern(landTex, 'repeat'), oceanPat = gctx.createPattern(oceanTex, 'repeat'); landPat.setTransform(new DOMMatrix().scale(2)); oceanPat.setTransform(new DOMMatrix().scale(2));
function drawGlobe(t) { const k = tw(t, 0, 1.7, x => x); const proj = d3.geoOrthographic().scale(lerp(1500, 2700, eio(k))).translate([W / 2, H / 2 + 120]).rotate([-lerp(60, 80, k), -lerp(14, 22, k)]);
  const path = d3.geoPath(proj, gctx); gctx.fillStyle = '#0d2747'; gctx.fillRect(0, 0, W, H);
  gctx.beginPath(); path({ type: 'Sphere' }); gctx.fillStyle = oceanPat; gctx.fill();
  gctx.beginPath(); path(land); gctx.fillStyle = landPat; gctx.fill();
  gctx.beginPath(); path(borders); gctx.strokeStyle = 'rgba(255,240,210,.35)'; gctx.lineWidth = 1.6; gctx.stroke();
  gctx.beginPath(); path(d3.geoGraticule10()); gctx.strokeStyle = 'rgba(255,255,255,.07)'; gctx.lineWidth = 1; gctx.stroke();
  const g = gctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1200); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)'); gctx.fillStyle = g; gctx.fillRect(0, 0, W, H); }

/* ---------- sky ---------- */
const sctx = $('sky').getContext('2d'); sctx.imageSmoothingQuality = 'high';
function drawSky(t, grey) { const k = (t - S.nums[0]); const sc = 4 + k * .05; const off = (k * 22) % (CH - 480);
  sctx.filter = grey ? 'grayscale(1) brightness(.75) contrast(1.1)' : 'none';
  sctx.drawImage(clouds, 0, CH - 480 - off - 480 * (sc / 4 - 1) / 2, CW, 480 * 4 / sc, 0, 0, W, H); sctx.filter = 'none'; }

/* ---------- echo texts ---------- */
const ECHO = [['n1', '11', 'destinations'], ['n2', '5', 'visa types'], ['n3', '1', 'expert team']];
const badgeSVG = c => `<svg class="badge" viewBox="0 0 24 24"><path d="M12 1.5l9 5.2v10.6l-9 5.2-9-5.2V6.7z" fill="none" stroke="${c}" stroke-width="2"/><path d="M7.5 12.2l3 3 6-6.2" fill="none" stroke="${c}" stroke-width="2.4"/></svg>`;
$('echoes').innerHTML = ECHO.map(([k, a, b], i) => `<div id="ec_${k}">${[3, 2, 1].map(g => `<div class="ghost" data-g="${g}">${a}</div>`).join('')}<div class="echo" style="top:820px"><span class="big">${a}</span><span class="sub">${b}${badgeSVG('#fff')}</span></div></div>`).join('');

/* ---------- country grid ---------- */
const CTRY = [['us', 'USA', 'us'], ['uk', 'UK', 'gb'], ['ca', 'CANADA', 'ca'], ['sch', 'SCHENGEN', 'eu'], ['jp', 'JAPAN', 'jp'], ['cn', 'CHINA', 'cn'], ['tr', 'TURKEY', 'tr'], ['tw', 'TAIWAN', 'tw'], ['sg', 'SINGAPORE', 'sg'], ['au', 'AUSTRALIA', 'au'], ['nz', 'NEW ZEALAND', 'nz']];
const meas = document.createElement('canvas').getContext('2d');
function gridFor(i) { const [k, name] = CTRY[i]; const rep = name.length <= 3 ? 3 : name.length <= 6 ? 2 : 1; const line = Array(rep).fill(name).join(' ');
  meas.font = '100px DMS'; const fs = Math.min(230, 100 * 960 / meas.measureText(line).width); const rows = Math.min(9, Math.floor(1500 / (fs * .98)));
  return { line, fs, rows }; }
let gridCache = [];
const ctryEnd = i => i < CTRY.length - 1 ? cs(CTRY[i + 1][0]) : S.stamps[1];

/* ---------- blueprint ---------- */
function bpHTML() { return `<div class="abs" style="inset:0;background-color:#a6192e;background-image:linear-gradient(rgba(255,255,255,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.13) 2px,transparent 2px),linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:300px 300px,300px 300px,60px 60px,60px 60px"></div>
 <svg class="abs" width="1200" height="2040" style="left:0;top:0;opacity:.22" fill="none" stroke="#fff" stroke-width="4">
  <circle cx="200" cy="1500" r="120"/><circle cx="200" cy="1500" r="92"/><text x="200" y="1512" text-anchor="middle" fill="#fff" stroke="none" font-family="Pop" font-size="34">ARRIVAL</text>
  <rect x="760" y="1760" width="300" height="160" rx="16"/><text x="910" y="1855" text-anchor="middle" fill="#fff" stroke="none" font-family="Pop" font-size="40">DEPARTED</text>
  <ellipse cx="150" cy="1080" rx="110" ry="70"/><path d="M60 1080h180M150 1010v140"/>
  <rect x="860" y="1150" width="200" height="280" rx="18"/><circle cx="960" cy="1270" r="54"/><path d="M906 1270h108M960 1216c-30 30-30 78 0 108M960 1216c30 30 30 78 0 108"/></svg>`; }
$('bp').innerHTML = bpHTML(); $('bp2').innerHTML = bpHTML();

/* ---------- collage (flat-lay) ---------- */
function mapPiece() { const c = document.createElement('canvas'); c.width = 460; c.height = 460; const x = c.getContext('2d'); const r = rng(42);
  x.fillStyle = '#f3e7d3'; x.fillRect(0, 0, 460, 460);
  x.fillStyle = '#cfe3c2'; for (let i = 0; i < 9; i++) { x.beginPath(); x.ellipse(r() * 460, r() * 460, 20 + r() * 50, 15 + r() * 40, r() * 3, 0, 7); x.fill(); }
